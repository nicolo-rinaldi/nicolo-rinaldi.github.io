<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <!-- Apply the saved theme before the page paints, to avoid a flash of the wrong one -->
  <script>try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="icon" type="image/png" href="{{ '/imgs/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/imgs/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@300;400;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <nav>
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Home"><span>&lt;</span>nicolò<span>&gt;</span></a>
    <a href="{{ '/blog.html' | relative_url }}">Blog</a>
    <a href="{{ '/contributions.html' | relative_url }}">Contributions</a>
    {% if site.cv %}<a href="{{ site.cv | relative_url }}">Resume</a>{% endif %}
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch light/dark theme"><i class="fa-regular fa-sun"></i></button>
  </nav>
  <main>
    {{ content }}
  </main>
  <footer>{{ site.author }} © {{ 'now' | date: '%Y' }}</footer>
  <script>
    // Theme toggle: sun = light, moon = dark. Default follows the OS;
    // a click saves the choice, and switching back to the OS theme forgets it.
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      var osDark = matchMedia('(prefers-color-scheme: dark)');
      var osTheme = function () { return osDark.matches ? 'dark' : 'light'; };
      var current = function () { return root.dataset.theme || osTheme(); };
      var render = function () { btn.querySelector('i').className = 'fa-regular fa-' + (current() === 'dark' ? 'moon' : 'sun'); };
      btn.addEventListener('click', function () {
        var next = current() === 'dark' ? 'light' : 'dark';
        try {
          if (next === osTheme()) { delete root.dataset.theme; localStorage.removeItem('theme'); }
          else { root.dataset.theme = next; localStorage.setItem('theme', next); }
        } catch (e) { root.dataset.theme = next; }
        render();
      });
      osDark.addEventListener('change', render);
      render();
    })();
  </script>
</body>
</html>
